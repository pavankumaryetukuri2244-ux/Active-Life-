<div class="vh-100 login-bg d-flex flex-column align-items-center justify-content-center p-3">
  
  <!-- Forgot Password Card -->
  <div class="card border-0 shadow-lg login-card-custom animate-fade-in" 
       style="border-radius: 20px; background: #ffffff; width: 420px; max-width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.15) !important;">
    <div class="card-body p-4 p-md-5">
      
      <!-- Back to Login arrow link -->
      <div>
        <a [routerLink]="'/pages/login-boxed'" class="back-link-custom">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 5px;">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back
        </a>
      </div>

      <!-- Icon Badge (Envelope) -->
      <div class="d-inline-flex align-items-center justify-content-center my-4" 
           style="width: 48px; height: 48px; border-radius: 12px; background: #eff6ff; color: #2563eb;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>

      <!-- Title / Header -->
      <div class="mb-4">
        <h3 class="font-weight-bold mb-1 text-dark" style="font-family: 'Poppins', sans-serif; font-size: 1.55rem; font-weight: 700; letter-spacing: -0.5px;">Forgot password?</h3>
        <p class="text-muted" style="font-size: 0.88rem; font-family: 'Inter', sans-serif; line-height: 1.4;">Enter your email and we'll send a 6-digit verification code.</p>
      </div>

      <!-- Recovery Form -->
      <form id="recoveryForm" (ngSubmit)="onSubmit()" #recoveryFormRef="ngForm" autocomplete="off">
        
        <!-- Email Input -->
        <div class="mb-4">
          <label class="form-label-custom" for="emailInput">Email Address</label>
          <input 
            id="emailInput" 
            type="email" 
            class="form-control custom-input-field" 
            placeholder="admin@healthfamily.com" 
            name="email"
            ngModel
            required 
            autocomplete="off">
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button 
            type="submit" 
            class="btn btn-login-custom py-2.5 fw-bold"
            [disabled]="!recoveryFormRef.valid">
            Send Verification Code
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
