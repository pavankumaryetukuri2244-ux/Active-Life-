<div class="vh-100 login-bg d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5" style="max-width: 500px;">
        
        <!-- Glassmorphism Card (White Shadow Theme) -->
        <div class="card glass-card border-0 shadow-2xl rounded-4 overflow-hidden">
          
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h3 class="fw-semibold text-dark mb-1">Forgot your Password?</h3>
              <p class="text-muted small">Use the form below to recover it.</p>
            </div>

            <!-- Recovery Form -->
            <form id="recoveryForm" (ngSubmit)="onSubmit()" #recoveryFormRef="ngForm" autocomplete="off">
              
              <!-- Email Input -->
              <div class="mb-4">
                <label for="emailInput" class="form-label small fw-semibold text-secondary">Email Address</label>
                <input 
                  id="emailInput" 
                  type="email" 
                  class="form-control" 
                  placeholder="Enter email..." 
                  name="email"
                  ngModel
                  required 
                  autocomplete="off">
                <div class="form-text text-muted small mt-1">
                  We'll send recovery instructions to this email address.
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-4">
                <button 
                  type="submit" 
                  class="btn btn-primary btn-lg rounded-3 py-2-5 shadow-sm fw-medium d-flex align-items-center justify-content-center transition-all hover-scale"
                  [disabled]="!recoveryFormRef.valid">
                  <span>Send Recovery Email</span>
                </button>
              </div>

              <!-- Divider -->
              <div class="text-center my-3 position-relative">
                <hr class="text-muted opacity-25">
                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">OR</span>
              </div>

              <!-- Sign in links -->
              <div class="text-center">
                <span class="small text-secondary">Remember your password? </span>
                <a [routerLink]="'/pages/login-boxed'" class="small text-primary text-decoration-none fw-semibold hover-underline">Sign in here</a>
                <span class="text-muted mx-2">|</span>
                <a [routerLink]="'/pages/register-boxed'" class="small text-primary text-decoration-none fw-semibold hover-underline">Create Account</a>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
