<div class="vh-100 login-bg d-flex align-items-center justify-content-end p-3 p-md-5" style="background-image: url('assets/images/originals/realestate_bg.jpg') !important;">
  <div class="login-overlay"></div>
  
  <div class="col-12 col-md-8 col-lg-5 col-xl-4 position-relative z-index-2 me-md-4">
    <!-- Login Card -->
    <div class="card login-card border-0 shadow-lg rounded-5 overflow-hidden">
      <div class="card-body p-4 p-md-5 text-center">
        
        <!-- Logo Area -->
        <div class="logo-container mb-4 d-flex align-items-center justify-content-center gap-3">
          <svg width="45" height="45" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Rounded Card Background -->
            <rect x="25" y="15" width="50" height="50" rx="10" fill="#f0f2f5" />
            
            <!-- Checkmark 1 (Teal/Green) -->
            <path d="M33 27L37 31L44 23" stroke="#48cbb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Line 1 (Dark Slate) -->
            <rect x="49" y="25" width="16" height="3.5" rx="1.75" fill="#3b4d61" />
            
            <!-- Checkmark 2 (Yellow) -->
            <path d="M33 39L37 43L44 35" stroke="#ffc043" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Line 2 (Dark Slate) -->
            <rect x="49" y="37" width="16" height="3.5" rx="1.75" fill="#3b4d61" />

            <!-- Checkmark 3 (Orange/Red) -->
            <path d="M33 51L37 55L44 47" stroke="#f06449" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Line 3 (Dark Slate) -->
            <rect x="49" y="49" width="10" height="3.5" rx="1.75" fill="#3b4d61" />
            
            <!-- Circle Badge (Light Blue) at Bottom Right with white border -->
            <circle cx="65" cy="65" r="16" fill="#4caee3" stroke="#ffffff" stroke-width="2.5" />
            <!-- White Tick inside circle -->
            <path d="M58 65L63 70L72 59" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

          <h1 class="logo-text m-0">
            <span class="text-priority">Priority</span>&nbsp;<span class="text-pulse">Pulse</span>
          </h1>
        </div>

        <!-- Form Title -->
        <h2 class="login-title mb-4">Login</h2>

        <!-- Alerts for feedback -->
        <div *ngIf="errorMessage" class="alert alert-danger-custom d-flex align-items-center border-0 rounded-3 mb-4 animate-fade-in" role="alert">
          <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
          <div>{{ errorMessage }}</div>
        </div>

        <div *ngIf="successMessage" class="alert alert-success-custom d-flex align-items-center border-0 rounded-3 mb-4 animate-fade-in" role="alert">
          <i class="fa-solid fa-circle-check me-2 fs-5"></i>
          <div>{{ successMessage }}</div>
        </div>

        <!-- Form -->
        <form class="needs-validation" [formGroup]="Form" (ngSubmit)="login()" autocomplete="off"
          [ngClass]="{'was-validated': submitted}">
          
          <!-- Username -->
          <div class="mb-3 position-relative">
            <input id="usernameInput" type="text" class="form-control custom-input" placeholder="User Name" required
              formControlName="loginid" autocomplete="new-name">
            <div class="invalid-feedback text-start mt-1 ms-2">
              This field is required.
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4 position-relative">
            <input id="passwordInput" [type]="showPassword ? 'text' : 'password'" class="form-control custom-input pe-5" placeholder="Password" required
              formControlName="password" autocomplete="password">
            <button type="button" class="btn btn-link password-toggle-btn text-secondary" (click)="togglePasswordVisibility()">
              <i class="fa-regular" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
            <div class="invalid-feedback text-start mt-1 ms-2">
              This field is required.
            </div>
          </div>

          <!-- Login Button -->
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-login btn-lg rounded-3 py-3 fw-bold uppercase-text" [ngClass]="{'button--loading': success}">
              LOGIN
            </button>
          </div>

          <!-- Forgot Password Button -->
          <div class="d-grid mb-2">
            <button type="button" [routerLink]="'/pages/forgot-password-boxed'" class="btn btn-forgot btn-lg rounded-3 py-3 fw-bold uppercase-text">
              FORGOT PASSWORD
            </button>
          </div>

          <!-- Helper Hint -->
          <p class="text-muted small mt-4 mb-0">
            Hint: Use <strong>admin</strong> / <strong>admin123</strong>
          </p>

        </form>

      </div>
    </div>
  </div>
</div>
