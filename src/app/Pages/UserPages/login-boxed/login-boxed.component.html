<div class="login-bg">
  <div class="login-wrapper">

    <!-- ─── Brand Section: Logo + Title above card ─── -->
    <div class="brand-section text-center animate-fade-in">
      <!-- Heart logo in white rounded square -->
      <div class="logo-box mx-auto">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="#F43F5E" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06
                   a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78
                   1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </div>
      <!-- Brand name -->
      <h2 class="brand-title">HealthFamily</h2>
      <!-- Portal subtitle -->
      <p class="brand-subtitle">Admin Portal</p>
    </div>

    <!-- ─── Login Card ─── -->
    <div class="login-card-custom animate-fade-in">

      <!-- Card header -->
      <div class="login-header-block">
        <h3 class="login-heading">Welcome back</h3>
        <p class="login-subheading">Sign in to your admin account</p>
      </div>

      <!-- Error / Success alerts -->
      <div *ngIf="errorMessage" class="alert-box-error animate-fade-in" role="alert">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert-box-success animate-fade-in" role="alert">
        {{ successMessage }}
      </div>

      <!-- ─── Login Form ─── -->
      <form [formGroup]="Form" (ngSubmit)="login()" autocomplete="off"
            [ngClass]="{'was-validated': submitted}">

        <!-- Email Address -->
        <div class="field-group">
          <label class="form-label-custom" for="usernameInput">Email Address</label>
          <div class="position-relative">
            <input
              id="usernameInput"
              type="text"
              class="form-control custom-input-field"
              placeholder="admin@healthfamily.com"
              formControlName="loginid"
              autocomplete="new-name"
              required>
            <div class="invalid-feedback ms-1">
              This field is required.
            </div>
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="form-label-custom" for="passwordInput">Password</label>
          <div class="position-relative">
            <input
              id="passwordInput"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control custom-input-field pe-5"
              placeholder="••••••••"
              formControlName="password"
              autocomplete="current-password"
              required>
            <!-- Eye toggle -->
            <button type="button"
                    class="password-toggle-btn-custom"
                    (click)="togglePasswordVisibility()"
                    tabindex="-1"
                    aria-label="Toggle password visibility">
              <!-- Eye outline (when password is hidden) -->
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off (when password is shown) -->
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" x2="22" y1="2" y2="22"></line>
              </svg>
            </button>
            <div class="invalid-feedback ms-1">
              This field is required.
            </div>
          </div>
        </div>

        <!-- Remember Me + Forgot Password -->
        <div class="login-bottom-row">
          <div class="d-flex align-items-center p-0 m-0" style="gap: 8px;">
            <input class="remember-check"
                   type="checkbox"
                   id="rememberMe">
            <label class="remember-label"
                   for="rememberMe">
              Remember me
            </label>
          </div>
          <a [routerLink]="'/pages/forgot-password-boxed'"
             class="forgot-link-custom">
            Forgot password?
          </a>
        </div>

        <!-- Sign In Button -->
        <div class="btn-login-custom-wrap">
          <button type="submit"
                  class="btn btn-login-custom"
                  [disabled]="success">
            <span *ngIf="success"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                  style="width:15px;height:15px;border-width:2px;"></span>
            <span>Sign In</span>
          </button>
        </div>

        <!-- SSL Footer -->
        <div class="text-center ssl-footer">
          <span class="ssl-text-custom">
            <svg width="12" height="12" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Secured with 256-bit SSL encryption
          </span>
        </div>

      </form>
    </div><!-- /login-card-custom -->

    <!-- Demo Credentials Footer -->
    <div class="demo-credentials text-center animate-fade-in">
      Demo: admin@healthfamily.com / admin123
    </div>

  </div>
</div>
