<div class="vh-100 login-bg d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6" style="max-width: 550px;">



        <!-- Glassmorphism Card (White Shadow Theme) -->
        <div class="card glass-card border-0 shadow-2xl rounded-4 overflow-hidden">

          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h3 class="fw-semibold text-dark mb-1">Create Account</h3>
              <p class="text-muted small">
                It only takes a <span class="text-success fw-medium">few seconds</span> to create your account
              </p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" (ngSubmit)="onSubmit()" #registerFormRef="ngForm">

              <!-- Email Input -->
              <div class="mb-4">
                <label for="emailInput" class="form-label small fw-semibold text-secondary">Email Address</label>
                <input id="emailInput" type="email" class="form-control" placeholder="Enter email..." name="email"
                  ngModel required autocomplete="email">
                <div class="form-text text-muted small mt-1">
                  We'll never share your email with anyone else.
                </div>
              </div>

              <!-- Username Input -->
              <div class="mb-4">
                <label for="usernameInput" class="form-label small fw-semibold text-secondary">Username</label>
                <input id="usernameInput" type="text" class="form-control" placeholder="Enter username..."
                  name="username" ngModel required autocomplete="username">
              </div>

              <!-- Password Fields Row -->
              <div class="row">
                <div class="col-sm-6">
                  <div class="mb-4">
                    <label for="passwordInput" class="form-label small fw-semibold text-secondary">Password</label>
                    <input id="passwordInput" type="password" class="form-control" placeholder="Enter password..."
                      name="password" ngModel required autocomplete="new-password">
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="mb-4">
                    <label for="confirmPasswordInput" class="form-label small fw-semibold text-secondary">Confirm
                      Password</label>
                    <input id="confirmPasswordInput" type="password" class="form-control"
                      placeholder="Repeat password..." name="confirmPassword" ngModel required
                      autocomplete="new-password">
                  </div>
                </div>
              </div>

              <!-- Terms and Conditions Checkbox -->
              <div class="form-check custom-checkbox mb-4">
                <input class="form-check-input cursor-pointer" type="checkbox" id="termsCheck" name="acceptTerms"
                  ngModel required>
                <label class="form-check-label small text-secondary cursor-pointer" for="termsCheck">
                  Accept our <a href="javascript:void(0);" (click)="onTermsClick()"
                    class="text-primary text-decoration-none fw-semibold hover-underline">Terms and Conditions</a>
                </label>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-4">
                <button type="submit"
                  class="btn btn-primary btn-lg rounded-3 py-2-5 shadow-sm fw-medium d-flex align-items-center justify-content-center transition-all hover-scale"
                  [disabled]="!registerFormRef.valid">
                  <span>Create Account</span>
                </button>
              </div>

              <!-- Divider -->
              <div class="text-center my-3 position-relative">
                <hr class="text-muted opacity-25">
                <span
                  class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">OR</span>
              </div>

              <!-- Sign in links -->
              <div class="text-center">
                <span class="small text-secondary">Already have an account? </span>
                <a [routerLink]="'/pages/login-boxed'"
                  class="small text-primary text-decoration-none fw-semibold hover-underline">Sign in</a>
                <span class="text-muted mx-2">|</span>
                <a [routerLink]="'/pages/forgot-password-boxed'"
                  class="small text-primary text-decoration-none fw-semibold hover-underline">Recover Password</a>
              </div>

            </form>
          </div>
        </div>



      </div>
    </div>
  </div>
</div>
